<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --surface-color: #fbfbfb;
    --fg-color: #242321;
    --subtext-color: #625f59;
    --border-color: rgba(36, 35, 33, 0.16);
    --border-radius: 8px;
    --font-family: "DepartureMono Nerd Font Mono", "DepartureMono Nerd Font", "Cascadia Code", monospace;
    --font-size: 15px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none; cursor: default; }
  #chip {
    height: 22px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    font-family: var(--font-family);
    font-size: calc(var(--font-size) - 4px);
    color: var(--subtext-color);
    background: var(--surface-color);
    border: 1px solid var(--border-color);
    border-radius: calc(var(--border-radius) - 2px);
  }
</style>
</head>
<body>
<div id="chip" title="Memory used by all of the browser's processes">RAM …</div>
<script>
  window.ram = { set(text) { document.getElementById("chip").textContent = "RAM " + text; } };
</script>
</body>
</html>
