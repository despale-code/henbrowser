<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg-color: #f2f1f0;
    --surface-color: #fbfbfb;
    --fg-color: #242321;
    --subtext-color: #625f59;
    --faint-color: rgba(36, 35, 33, 0.45);
    --hover-bg: rgba(36, 35, 33, 0.07);
    --border-color: rgba(36, 35, 33, 0.16);
    --accent-ring: #242321;
    --shadow-color: rgba(20, 19, 18, 0.18);
    --border-radius: 8px;
    --font-family: "DepartureMono Nerd Font Mono", "DepartureMono Nerd Font", "Cascadia Code", monospace;
    --font-size: 15px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body { font-family: var(--font-family); font-size: calc(var(--font-size) - 2px); color: var(--fg-color); }
  #list {
    margin: 0 0 8px;
    padding: 4px;
    background: var(--surface-color);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    box-shadow: 0 8px 22px var(--shadow-color);
  }
  .row {
    height: 36px;
    padding: 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: calc(var(--border-radius) - 3px);
  }
  .row.sel { background: var(--hover-bg); }
  .title { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .url { flex: 1 1 0; min-width: 0; color: var(--faint-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="list"></div>
<script>
  const post = (m) => window.ipc.postMessage(JSON.stringify(m));
  const list = document.getElementById("list");
  let items = [];
  const bare = (u) => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  window.sg = {
    set(next) {
      items = next;
      list.innerHTML = "";
      items.forEach((it, i) => {
        const row = document.createElement("div");
        row.className = "row";
        const t = document.createElement("span");
        t.className = "title";
        t.textContent = (it.tab ? "⇥ " : it.bookmark ? "★ " : "") + (it.title || bare(it.url));
        const u = document.createElement("span");
        u.className = "url";
        u.textContent = it.tab ? "Switch to tab" : it.title ? bare(it.url) : "";
        row.append(t, u);
        // mousedown, not click: the address field blurs (and hides this) as focus moves here.
        row.addEventListener("mousedown", (e) => {
          e.preventDefault();
          post(it.tab ? { cmd: "switch_to_tab", id: it.tab } : { cmd: "navigate", input: it.url });
          post({ cmd: "suggest_hide" });
        });
        list.appendChild(row);
      });
    },
    sel(n) {
      [...list.children].forEach((r, i) => r.classList.toggle("sel", i === n));
    },
  };
</script>
</body>
</html>
