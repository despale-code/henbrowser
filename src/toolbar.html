<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* =========================================================================
   * Hen Browser chrome: toolbar row, tab strip / vertical tab sidebar.
   *
   * This page covers the whole window *behind* the web page; the page is laid out on top of
   * the content area, so only the toolbar row and the tab strip (or sidebar) are visible.
   *
   * Colors come from ~/.config/chickenwm/browser.css (hot-reloaded) and, when a light/dark
   * override or "match website colors" is active, from #mode-theme.
   * ========================================================================= */
  :root {
    --bg-color: #f2f1f0;
    --tab-strip-bg: #e8e6e3;
    --sidebar-bg: #e8e6e3;
    --surface-color: #fbfbfb;
    --field-bg: rgba(251, 251, 251, 0.85);
    --field-hover-bg: #fbfbfb;
    --field-focus-bg: #fbfbfb;

    --fg-color: #242321;
    --subtext-color: #625f59;
    --faint-color: rgba(36, 35, 33, 0.45);

    --accent-color: #242321;
    --accent-fg: #f7f6f6;
    --accent-secondary: #625f59;
    --accent-ring: #242321;
    --hover-bg: rgba(36, 35, 33, 0.07);
    --press-bg: rgba(36, 35, 33, 0.14);

    --border-color: rgba(36, 35, 33, 0.16);
    --shadow-color: rgba(20, 19, 18, 0.18);
    --border-radius: 8px;
    --tab-radius: 7px;

    --close-hover-bg: #d32f2f;
    --close-hover-fg: #ffffff;

    --font-family: "DepartureMono Nerd Font Mono", "DepartureMono Nerd Font", "Cascadia Code", monospace;
    --font-size: 15px;

    --anim-duration: 200ms;
    --anim-bezier: cubic-bezier(0.05, 0.9, 0.1, 1.05);
    --anim-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
    --theme-fade: 320ms;

    /* Layout (sizes must match TOOLBAR_ROW_H / TOOLBAR_H / SIDEBAR_W in main.rs) */
    --row-h: 48px;
    --strip-h: 34px;
    --sidebar-w: 240px;
    --sidebar-collapsed-w: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-color);
    color: var(--fg-color);
    font-family: var(--font-family);
    font-size: var(--font-size);
    user-select: none;
    -webkit-font-smoothing: antialiased;
    transition: background-color var(--theme-fade) var(--anim-smooth), color var(--theme-fade) var(--anim-smooth);
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: default;
    display: grid;
    place-items: center;
  }

  /* Motion off: the browser's own Animations setting (deliberately not Windows' "reduce motion",
     which many tiling-WM setups turn off system-wide). */
  body.no-anim *, body.no-anim *::before, body.no-anim *::after { transition: none !important; animation: none !important; }

  /* Top-edge invisible resize grips (for borderless window) */
  .grip { position: fixed; z-index: 20; }
  #grip-n  { top: 0; left: 10px; right: 10px; height: 4px; cursor: ns-resize; }
  #grip-nw { top: 0; left: 0; width: 10px; height: 10px; cursor: nwse-resize; }
  #grip-ne { top: 0; right: 0; width: 10px; height: 10px; cursor: nesw-resize; }

  /* ── Row 1: toolbar ── */
  #row {
    display: flex;
    align-items: center;
    gap: 6px;
    height: var(--row-h);
    padding: 0 0 0 12px;
    background: var(--bg-color);
    position: relative;
    z-index: 5;
    transition: background-color var(--theme-fade) var(--anim-smooth);
  }
  .spacer { flex: 1 1 0; min-width: 8px; align-self: stretch; }

  .btn {
    width: 34px;
    height: 32px;
    border-radius: var(--border-radius);
    color: var(--fg-color);
    flex: none;
    transition: background-color var(--anim-duration) var(--anim-smooth),
                color var(--theme-fade) var(--anim-smooth),
                transform 160ms var(--anim-bezier);
  }
  .btn:hover { background: var(--hover-bg); }
  .btn:active { background: var(--press-bg); transform: scale(0.9); }
  .btn:disabled { opacity: 0.35; }
  #back:hover:not(:disabled) { transform: translateX(-2px); }
  #fwd:hover:not(:disabled) { transform: translateX(2px); }
  #newtab:hover { transform: rotate(90deg); }
  #newtab:active { transform: rotate(90deg) scale(0.9); }

  #close {
    width: 44px;
    height: 100%;
    margin-left: 2px;
    color: var(--subtext-color);
    font-size: 15px;
    transition: background-color var(--anim-duration) var(--anim-smooth), color var(--anim-duration) var(--anim-smooth);
  }
  #close:hover { background: var(--close-hover-bg); color: var(--close-hover-fg); }
  #close:active { filter: brightness(0.9); }

  /* Address field */
  #field {
    position: relative;
    flex: 0 1 620px;
    min-width: 240px;
    height: 34px;
    display: flex;
    align-items: center;
    border-radius: var(--border-radius);
    background: var(--field-bg);
    border: 1px solid var(--border-color);
    overflow: hidden;
    transition: background-color var(--theme-fade) var(--anim-smooth),
                border-color var(--anim-duration) var(--anim-smooth),
                box-shadow 260ms var(--anim-smooth),
                flex-basis 320ms var(--anim-bezier),
                transform 260ms var(--anim-bezier);
  }
  #field:hover { background: var(--field-hover-bg); border-color: var(--faint-color); }
  #field.focus {
    flex-basis: 760px;
    background: var(--field-focus-bg);
    border-color: var(--accent-ring);
    box-shadow: 0 0 0 2px var(--accent-ring), 0 6px 18px var(--shadow-color);
  }

  #shield {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 100%;
    padding: 0 4px 0 10px;
    color: var(--faint-color);
    font-size: 13px;
    flex: none;
    border-radius: var(--border-radius) 0 0 var(--border-radius);
    transition: color var(--anim-duration) var(--anim-smooth), opacity var(--anim-duration);
  }
  #shield:hover { color: var(--fg-color); }
  #shield.on { color: var(--subtext-color); }
  #shield.off { opacity: 0.45; text-decoration: line-through; }
  #shield #blocked {
    background: var(--border-color);
    color: var(--fg-color);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    margin-left: 2px;
    transition: background-color var(--theme-fade), color var(--theme-fade);
  }
  #shield.bump { animation: shield-bump 380ms var(--anim-bezier); }
  @keyframes shield-bump { 40% { transform: scale(1.18); color: var(--accent-ring); } }

  #addr {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 8px;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--fg-color);
    font-family: inherit;
    font-size: inherit;
    text-align: center;
  }
  #field.focus #addr { text-align: left; }
  #addr::placeholder { color: var(--faint-color); }

  #star {
    width: 28px;
    height: 100%;
    color: var(--faint-color);
    flex: none;
    font-size: 14px;
    transition: color var(--anim-duration), transform 220ms var(--anim-bezier);
  }
  #star:hover { color: var(--fg-color); transform: scale(1.15); }
  #star.on { color: var(--accent-secondary, var(--fg-color)); }
  #star[hidden] { display: none; }

  #reload { transition: background-color var(--anim-duration), transform 420ms var(--anim-bezier); }
  #reload:hover { transform: rotate(-90deg); }
  #reload.loading { animation: spin 0.9s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  #progress {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    width: 100%;
    background: linear-gradient(90deg, transparent, var(--accent-ring), transparent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms var(--anim-smooth);
  }
  #field.loading #progress { opacity: 1; animation: load-sweep 1.2s var(--anim-smooth) infinite; }
  @keyframes load-sweep {
    0% { transform: translateX(-100%) scaleX(0.3); }
    60% { transform: translateX(30%) scaleX(0.7); }
    100% { transform: translateX(100%) scaleX(0.3); }
  }

  #exts { display: flex; gap: 3px; flex: none; }
  .ext {
    width: 32px;
    height: 32px;
    border-radius: var(--border-radius);
    animation: pop-in 320ms var(--anim-bezier) both;
    transition: background-color var(--anim-duration), transform 160ms var(--anim-bezier);
  }
  .ext:hover { background: var(--hover-bg); transform: translateY(-1px); }
  .ext img { width: 18px; height: 18px; border-radius: 3px; }
  .ext.open { background: var(--press-bg); }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.6); } }

  /* ── Tab strip (horizontal) ── */
  #tabs {
    display: flex;
    height: var(--strip-h);
    background: var(--tab-strip-bg);
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    position: relative;
    z-index: 4;
    transition: background-color var(--theme-fade) var(--anim-smooth);
  }
  #tabs::-webkit-scrollbar { display: none; }

  /* Sliding highlight behind the active tab (moves between tabs instead of jumping). */
  #indicator {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 100%;
    background: var(--accent-color);
    box-shadow: 0 2px 8px var(--shadow-color);
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: transform 360ms var(--anim-bezier), width 360ms var(--anim-bezier),
                height 360ms var(--anim-bezier), opacity 200ms, background-color var(--theme-fade);
  }
  #indicator.ready { opacity: 1; }

  .tab {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1 1 0;
    min-width: 130px;
    max-width: 260px;
    padding: 0 30px 0 12px;
    color: var(--subtext-color);
    border-right: 1px solid var(--border-color);
    transition: background-color var(--anim-duration) var(--anim-smooth),
                color 260ms var(--anim-smooth),
                min-width 300ms var(--anim-smooth), max-width 300ms var(--anim-smooth),
                height 300ms var(--anim-smooth),
                padding 300ms var(--anim-smooth), opacity 260ms var(--anim-smooth),
                transform 320ms var(--anim-bezier);
  }
  .tab:hover:not(.active) { background: var(--hover-bg); color: var(--fg-color); }
  .tab.active { color: var(--accent-fg); }
  /* Colour groups (right-click a tab): a stripe along the tab's edge. */
  .tab[class*="group-"] { box-shadow: inset 0 -3px 0 var(--group-color); }
  body.vertical .tab[class*="group-"] { box-shadow: inset 3px 0 0 var(--group-color); }
  .tab.group-1 { --group-color: #d9534f; }
  .tab.group-2 { --group-color: #e8a33d; }
  .tab.group-3 { --group-color: #e3c84a; }
  .tab.group-4 { --group-color: #5cb85c; }
  .tab.group-5 { --group-color: #4a90d9; }
  .tab.group-6 { --group-color: #9b6bd3; }
  .tab.asleep:not(.active) .title, .tab.asleep:not(.active) .favicon { opacity: 0.52; }
  .tab.asleep:not(.active)::after {
    content: "zzz";
    font-size: 9px;
    opacity: 0.55;
    margin-left: 4px;
    letter-spacing: -0.5px;
  }
  .tab.pinned { flex: 0 0 42px; min-width: 42px; max-width: 48px; padding: 0 10px; justify-content: center; }
  body:not(.vertical) .tab.pinned .title, body:not(.vertical) .tab.pinned .close { display: none; }
  body.vertical .tab.pinned { border-left: 2px solid var(--accent-color); }
  .tab.drag-over { outline: 1px dashed var(--accent-ring); }
  #bmbar {
    display: none;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 12px;
    background: var(--bg-color);
    border-bottom: 1px solid var(--border-color);
    overflow-x: auto;
    scrollbar-width: none;
    z-index: 4;
    position: relative;
  }
  body.bmbar #bmbar { display: flex; }
  .bm-item {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 5px;
    color: var(--subtext-color);
    white-space: nowrap;
  }
  .bm-item:hover { background: var(--hover-bg); color: var(--fg-color); }

  /* Open: grow from nothing and fade in. Close: shrink away. */
  .tab.entering {
    opacity: 0;
    min-width: 0 !important;
    max-width: 0 !important;
    padding-left: 0 !important;
    padding-right: 0 !important;
    transform: scale(0.9);
    overflow: hidden;
  }
  .tab.leaving {
    opacity: 0;
    min-width: 0 !important;
    max-width: 0 !important;
    padding-left: 0 !important;
    padding-right: 0 !important;
    pointer-events: none;
    overflow: hidden;
  }

  /* Favicon (or letter avatar) with a loading ring */
  .favicon {
    position: relative;
    width: 16px;
    height: 16px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 4px;
    font-size: 10px;
    line-height: 1;
    color: var(--accent-fg);
    background: var(--subtext-color);
    transition: opacity 200ms, background-color var(--theme-fade);
  }
  .favicon.has-img { background: transparent; }
  .favicon img {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 260ms var(--anim-smooth), transform 320ms var(--anim-bezier);
  }
  .favicon img.loaded { opacity: 1; transform: none; }
  .tab.active .favicon:not(.has-img) { background: var(--accent-fg); color: var(--accent-color); }
  .favicon::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: currentColor;
    opacity: 0;
    transition: opacity 200ms;
  }
  .tab.loading .favicon::after { opacity: 0.9; animation: spin 0.8s linear infinite; }
  .tab.loading .favicon img { transform: scale(0.75); }

  .tab .title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: var(--font-size);
    font-weight: normal;
    transition: opacity 200ms;
  }

  .tab .close {
    position: absolute;
    right: 6px;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    font-size: 12px;
    color: inherit;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 140ms, background-color 140ms, transform 200ms var(--anim-bezier);
  }
  .tab:hover .close, .tab.active .close { opacity: 0.7; transform: none; }
  .tab .close:hover { opacity: 1; background: var(--press-bg); }
  .tab.active .close:hover { background: color-mix(in srgb, var(--accent-fg) 22%, transparent); }

  /* ── Vertical tabs: sidebar under the toolbar row, left of the page ── */
  body.vertical #tabs {
    position: fixed;
    left: 0;
    top: var(--row-h);
    bottom: 0;
    width: var(--sidebar-w);
    height: auto;
    flex-direction: column;
    gap: 2px;
    padding: 8px 6px 46px;
    overflow-x: hidden;
    overflow-y: auto;
    background: var(--sidebar-bg);
    border-top: 1px solid var(--border-color);
    border-bottom: 0;
    border-right: 1px solid var(--border-color);
    transition: width 320ms var(--anim-bezier), background-color var(--theme-fade) var(--anim-smooth);
  }
  body.vertical.collapsed #tabs { width: var(--sidebar-collapsed-w); }
  body.vertical .tab {
    flex: none;
    height: 36px;
    min-width: 0;
    max-width: none;
    border-right: 0;
    border-radius: var(--tab-radius);
    padding: 0 30px 0 10px;
  }
  body.vertical .tab.entering { max-width: none !important; height: 0 !important; transform: translateX(-14px); }
  body.vertical .tab.leaving { min-width: 0 !important; height: 0 !important; margin-top: -2px; }
  body.vertical #indicator { border-radius: var(--tab-radius); }
  body.vertical.collapsed .tab { padding: 0; justify-content: center; }
  body.vertical.collapsed .tab .title, body.vertical.collapsed .tab .close { display: none; }

  #sidebar-toggle {
    display: none;
    position: fixed;
    left: 8px;
    bottom: 8px;
    width: 32px;
    height: 30px;
    border-radius: var(--border-radius);
    color: var(--subtext-color);
    z-index: 6;
    transition: background-color var(--anim-duration), transform 320ms var(--anim-bezier);
  }
  body.vertical #sidebar-toggle { display: grid; }
  #sidebar-toggle:hover { background: var(--hover-bg); color: var(--fg-color); }
  body.vertical.collapsed #sidebar-toggle { transform: rotate(180deg); }

  /* ── Auto-hide: a thin strip; hovering it slides the tab panel out over the page ── */
  body.vertical.autohide #tabs {
    width: 6px;
    padding: 0;
    overflow: hidden;
    cursor: default;
    transition: background-color 200ms;
  }
  body.vertical.autohide #tabs > * { visibility: hidden; }
  body.vertical.autohide #tabs:hover { background: var(--accent-color); }
  body.vertical.autohide #sidebar-toggle { display: none; }

  /* ── Flyout (the sliding panel itself, a separate webview over the page) ── */
  body.flyout { background: transparent; }
  body.flyout #row, body.flyout .grip, body.flyout #sidebar-toggle { display: none !important; }
  body.flyout #tabs {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: var(--sidebar-w);
    border-top: 0;
    border-right: 1px solid var(--border-color);
    transform: translateX(-104%);
    transition: transform 280ms var(--anim-bezier), background-color var(--theme-fade);
  }
  body.flyout.open #tabs { transform: none; }
  body.flyout.open.closing #tabs { transform: translateX(-104%); transition-duration: 200ms; }
  #pin {
    display: none;
    position: fixed;
    left: 8px;
    bottom: 8px;
    height: 30px;
    padding: 0 10px;
    border-radius: var(--border-radius);
    color: var(--subtext-color);
    font-size: 12px;
    z-index: 6;
    transition: background-color var(--anim-duration), color var(--anim-duration);
  }
  body.flyout #pin { display: grid; }
  #pin:hover { background: var(--hover-bg); color: var(--fg-color); }

  /* =========================================================================
   * Surface effects: theme gradient, ambient page glow and grain. They sit in #fx, behind the
   * toolbar row and the tabs, which turn translucent while any effect is on. Strengths come in
   * as --fx-* (0–1) from the browser's Appearance settings.
   * ========================================================================= */
  @property --amb1 { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --amb2 { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --amb3 { syntax: "<color>"; inherits: true; initial-value: transparent; }
  @property --amb4 { syntax: "<color>"; inherits: true; initial-value: transparent; }
  :root { --fx-gradient: 0; --fx-noise: 0; --fx-ambient: 0; }

  #fx {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  #fx > div { position: absolute; }
  :root { --amb-ease: cubic-bezier(0.37, 0, 0.18, 1); }

  /* Theme gradient: accent washes from the corners, drifting very slowly. */
  #fx-gradient {
    inset: -25%;
    opacity: var(--fx-gradient);
    background:
      radial-gradient(42% 55% at 18% 22%, color-mix(in srgb, var(--accent-color) 30%, transparent), transparent 70%),
      radial-gradient(38% 50% at 82% 12%, color-mix(in srgb, var(--accent-secondary) 26%, transparent), transparent 70%),
      radial-gradient(50% 60% at 50% 95%, color-mix(in srgb, var(--accent-color) 16%, transparent), transparent 75%);
    animation: fx-drift 48s ease-in-out infinite alternate;
    transition: opacity 900ms var(--anim-smooth);
  }
  @keyframes fx-drift {
    0%   { transform: translate3d(-3%, -2%, 0) rotate(0deg) scale(1); }
    50%  { transform: translate3d(2%, 3%, 0) rotate(4deg) scale(1.05); }
    100% { transform: translate3d(4%, -1%, 0) rotate(-3deg) scale(1.02); }
  }

  /* Ambient glow: page colors as large soft blobs hugging the page edge, cross-fading
     (registered colors interpolate) and wandering slowly. */
  /* A new page's colors arrive one glow after another (staggered, slow ease-in-out). */
  #fx > #fx-ambient {
    inset: 0;
    opacity: var(--fx-ambient);
    transition: opacity 900ms var(--anim-smooth),
                --amb1 2.6s var(--amb-ease),
                --amb2 3.2s var(--amb-ease) 0.25s,
                --amb3 3.6s var(--amb-ease) 0.5s,
                --amb4 4.2s var(--amb-ease) 0.75s;
  }
  #fx > #fx-ambient.live {
    transition: opacity 900ms var(--anim-smooth), --amb1 1.4s linear, --amb2 1.4s linear,
                --amb3 1.4s linear, --amb4 1.4s linear;
  }
  /* …while each glow blooms (swells, brightens, then settles) and a soft wave of the new
     color washes across the chrome. `scale` composes with the drift's `transform`. */
  #fx-ambient.shift .b1 { animation: amb-a 34s ease-in-out infinite alternate, amb-bloom 2.8s var(--amb-ease) 0s 1; }
  #fx-ambient.shift .b2 { animation: amb-b 41s ease-in-out infinite alternate, amb-bloom 3.1s var(--amb-ease) 0.2s 1 backwards; }
  #fx-ambient.shift .b3 { animation: amb-c 47s ease-in-out infinite alternate, amb-bloom 3.1s var(--amb-ease) 0.4s 1 backwards; }
  #fx-ambient.shift .b4 { animation: amb-d 53s ease-in-out infinite alternate, amb-bloom 3.4s var(--amb-ease) 0.6s 1 backwards; }
  @keyframes amb-bloom {
    0%   { scale: 1; filter: blur(28px); }
    38%  { scale: 1.22; filter: blur(40px) saturate(1.4) brightness(1.15); }
    100% { scale: 1; filter: blur(28px); }
  }
  #fx-wash {
    position: absolute;
    inset: -20% -50%;
    background: radial-gradient(28% 90% at 50% 10%, var(--wash, transparent), transparent 70%);
    filter: blur(24px);
    opacity: 0;
    pointer-events: none;
  }
  #fx-ambient.shift #fx-wash { animation: amb-wash 2.6s var(--amb-ease) 1; }
  @keyframes amb-wash {
    0%   { opacity: 0; transform: translateX(-38%); }
    35%  { opacity: 0.6; }
    100% { opacity: 0; transform: translateX(38%); }
  }
  #fx-ambient .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(28px);
    will-change: transform;
  }
  #fx-ambient .b1 { width: 70vw; height: 190px; left: 15vw; top: 10px;

  #fx-ambient .b3 { width: 46vw; height: 170px; right: -8vw; top: -10px;

  #fx-ambient .b4 { width: 300px; height: 75vh; left: -90px; top: 20vh;
    background: radial-gradient(closest-side, var(--amb4), transparent); animation: amb-d 53s ease-in-out infinite alternate; }
  @keyframes amb-a { to { transform: translate3d(6vw, 12px, 0) scale(1.15, 0.9); } }

  /* Grain, like Zen: static fractal noise blended into whatever is under it. */

  /* =========================================================================
   * Sidebar layout: there is no top bar. The sidebar carries back / forward (top left),

  :root { --win-border: 3px; --amb1: var(--accent-color); --amb2: var(--accent-color); --amb3: var(--accent-color); }

  /* The bookmarks bar runs along the top of the page, right of the sidebar. */
  body.bmbar #bmbar {

  /* Window border: a gradient ring from the theme accent through the page's ambient colors,

  @property --border-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }

  #newtab-pop {

<script>
  const post = (m) => window.ipc.postMessage(JSON.stringify(m));
  const $ = (id) => document.getElementById(id);
  const tabsEl = $("tabs"), addr = $("addr"), field = $("field"), indicator = $("indicator"), bmbarEl = $("bmbar");
  const flyout = !!window.__HEN_FLYOUT;
  if (flyout) document.body.classList.add("flyout");
  let autohide = false;
  let currentUrl = "";
  let vertical = false;
  let dragTabId = null;

  const pretty = (url) => {
    try {
      const u = new URL(url);
      if (u.protocol === "http:" || u.protocol === "https:") return u.hostname.replace(/^www\./, "");
    } catch (_) {}
    return url;
  };
  const letterOf = (t) => ((t.title || pretty(t.url) || "?").trim()[0] || "?").toUpperCase();

  $("menu-btn").onclick = () => { closeNewTabPop(); post({ cmd: "toggle_menu" }); };

  $("fwd").onclick = () => post({ cmd: "forward" });
  $("reload").onclick = () => post({ cmd: "reload" });

    e.preventDefault();
    e.stopPropagation();
    closeNewTabPop();
    if (e.shiftKey) post({ cmd: "new_private_tab" });

  };
  newTabPop.querySelectorAll("button").forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      closeNewTabPop();
      post({ cmd: b.dataset.kind === "private" ? "new_private_tab" : "new_tab" });
    };
  });
  document.addEventListener("click", closeNewTabPop);
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeNewTabPop(); });
  addEventListener("blur", closeNewTabPop);

  // Sidebar width: drag its right edge. The page area follows live; the width is saved on release.
  const resizer = $("side-resize");
  resizer.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    resizer.setPointerCapture(e.pointerId);
    document.body.classList.add("resizing");
    const border = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--win-border")) || 3;
    let last = 0, frame = 0;
    const widthAt = (x) => Math.round(Math.min(520, Math.max(180, x - border)));
    const move = (ev) => {
      last = widthAt(ev.clientX);
      fxRoot.setProperty("--sidebar-w", last + "px");
      if (!frame) frame = requestAnimationFrame(() => { frame = 0; post({ cmd: "sidebar_width", w: last }); });
    };
    const up = () => {
      resizer.removeEventListener("pointermove", move);
      resizer.removeEventListener("pointerup", up);
      resizer.removeEventListener("pointercancel", up);
      document.body.classList.remove("resizing");
      if (last) post({ cmd: "sidebar_width", w: last, done: true });

    resizer.addEventListener("pointermove", move);
    resizer.addEventListener("pointerup", up);
    resizer.addEventListener("pointercancel", up);
  });
  $("star").onclick = () => post({ cmd: "toggle_bookmark" });
  $("shield").onclick = () => post({ cmd: "toggle_site_adblock" });
  $("sidebar-toggle").onclick = () => post({ cmd: "toggle_sidebar" });
  $("pin").onclick = () => post({ cmd: "toggle_sidebar_autohide" });

  // Auto-hide: hovering the strip opens the panel (short delay so passing by doesn't).
  let peekTimer = null;
  $("side").addEventListener("mouseenter", () => {
    if (flyout || !autohide || !vertical) return;
    peekTimer = setTimeout(() => post({ cmd: "sidebar_peek", show: true }), 70);
  });
  $("side").addEventListener("mouseleave", () => { clearTimeout(peekTimer); });

  let closeTimer = null;
  if (flyout) {
    document.documentElement.addEventListener("mouseleave", () => {
      closeTimer = setTimeout(() => {
        document.body.classList.add("closing");
        setTimeout(() => {
          if (document.body.classList.contains("closing")) {

  const pickSuggest = (n) => {
    suggestSel = n;
    addr.value = n >= 0 ? (suggestions[n].tab ? suggestions[n].title : suggestions[n].url) : typed;
    post({ cmd: "suggest_sel", sel: n });
  };
  addr.addEventListener("input", () => {
    typed = addr.value;
    suggestSel = -1;
    if (!typed.trim()) { hideSuggest(); return; }
    const r = field.getBoundingClientRect();
    post({ cmd: "suggest", text: typed, x: r.left, w: r.width, y: r.bottom });
  });
  addr.addEventListener("keydown", (e) => {
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && suggestions.length) {
      e.preventDefault();
      const n = suggestions.length;
      pickSuggest(e.key === "ArrowDown" ? (suggestSel + 1 >= n ? -1 : suggestSel + 1) : (suggestSel < 0 ? n - 1 : suggestSel - 1));
      return;
    }
    if (e.key === "Enter") {
      const picked = suggestSel >= 0 ? suggestions[suggestSel] : null;
      // "@…" with nothing picked: the first matching tab.
      const tab = picked ? picked.tab : (typed.startsWith("@") && suggestions[0] ? suggestions[0].tab : null);
      post(tab ? { cmd: "switch_to_tab", id: tab } : { cmd: "navigate", input: addr.value });
      hideSuggest(); addr.blur();
    }
    if (e.key === "Escape") {
      if (suggestions.length) { addr.value = typed; hideSuggest(); return; }
      addr.blur(); post({ cmd: "focus_page" });
    }
  });
  addr.addEventListener("focus", () => { field.classList.add("focus"); addr.value = currentUrl; addr.select(); });
  addr.addEventListener("blur", () => {
    field.classList.remove("focus");
    addr.value = pretty(currentUrl);
    // Delayed: a click on the dropdown moves focus before its own mousedown is handled.
    setTimeout(() => { if (document.activeElement !== addr) hideSuggest(); }, 150);
  });
  tabsEl.addEventListener("wheel", (e) => { if (!vertical) tabsEl.scrollLeft += e.deltaY; }, { passive: true });

  // ── Tabs: updated in place (keyed by id) so open / close / switch can animate ──
  const tabEls = new Map(); // id -> element

  function makeTab(t) {
    const el = document.createElement("div");
    el.className = "tab entering";
    el.dataset.id = t.id;
    el.draggable = true;
    el.innerHTML = '<span class="favicon"></span><span class="title"></span><button class="close" title="Close tab (Ctrl+W)">&#x2715;</button>';
    el.ondragstart = (e) => {
      dragTabId = Number(el.dataset.id);
      e.dataTransfer.effectAllowed = "move";
    };
    el.ondragover = (e) => {
      e.preventDefault();
      el.classList.add("drag-over");
    };
    el.ondragleave = () => el.classList.remove("drag-over");
    el.ondrop = (e) => {
      e.preventDefault();
      el.classList.remove("drag-over");
      const toId = Number(el.dataset.id);
      if (dragTabId !== null && dragTabId !== toId) {
        post({ cmd: "reorder_tab", from_id: dragTabId, to_id: toId });
      }
      dragTabId = null;
    };
    el.onmousedown = (e) => {
      const id = Number(el.dataset.id);
      if (e.button === 1) { post({ cmd: "close_tab", id }); e.preventDefault(); }
      else if (e.button === 0 && !e.target.classList.contains("close")) {
        if (e.detail === 2 && !vertical) post({ cmd: "toggle_maximize" });
        else if (!el.classList.contains("active")) post({ cmd: "switch_tab", id });
      }
    };
    el.querySelector(".close").onclick = (e) => { e.stopPropagation(); post({ cmd: "close_tab", id: Number(el.dataset.id) }); };
    // Right-click cycles colour group; Shift+Right-click pins/unpins the tab.
    el.oncontextmenu = (e) => {
      e.preventDefault();
      if (e.shiftKey) {
        post({ cmd: "pin_tab", id: Number(el.dataset.id) });
        return;
      }
      const g = (Number(el.dataset.group || 0) + 1) % 7;
      post({ cmd: "set_tab_group", id: Number(el.dataset.id), group: g });
    };
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("entering")));
    return el;
  }

  function setFavicon(el, t) {
    const box = el.querySelector(".favicon");
    const want = t.icon || "";
    if (box.dataset.src === want && box.childElementCount === (want ? 1 : 0) && (want || box.textContent)) {
      if (!want) box.textContent = letterOf(t);
      return;
    }
    box.dataset.src = want;
    box.textContent = "";
    box.classList.remove("has-img");
    if (!want) { box.textContent = letterOf(t); return; }
    const img = new Image();
    img.alt = "";
    img.onload = () => { box.classList.add("has-img"); img.classList.add("loaded"); };
    img.onerror = () => { if (box.dataset.src === want) { box.textContent = letterOf(t); img.remove(); } };
    img.src = want;
    box.appendChild(img);
  }

  let stretching = false;
  function moveIndicator() {
    if (stretching) return;
    const active = tabsEl.querySelector(".tab.active:not(.leaving)");
    if (!active) { indicator.classList.remove("ready"); return; }
    indicator.style.width = active.offsetWidth + "px";
    indicator.style.height = active.offsetHeight + "px";
    indicator.style.transform = `translate(${active.offsetLeft}px, ${active.offsetTop}px)`;
    indicator.classList.add("ready");
  }

  function hopIndicator(from, to) {
    if (document.body.classList.contains("no-anim") || !from || !to || !indicator.classList.contains("ready")) {
      moveIndicator();
      return;
    }
    const x0 = Math.min(from.offsetLeft, to.offsetLeft);
    const y0 = Math.min(from.offsetTop, to.offsetTop);
    const x1 = Math.max(from.offsetLeft + from.offsetWidth, to.offsetLeft + to.offsetWidth);
    const y1 = Math.max(from.offsetTop + from.offsetHeight, to.offsetTop + to.offsetHeight);
    stretching = true;
    indicator.classList.add("stretch");
    if (vertical) {
      indicator.style.height = (y1 - y0) + "px";
      indicator.style.transform = `translate(${to.offsetLeft}px, ${y0}px)`;
    } else {
      indicator.style.width = (x1 - x0) + "px";
      indicator.style.transform = `translate(${x0}px, ${to.offsetTop}px)`;
    }
    setTimeout(() => {
      stretching = false;
      indicator.classList.remove("stretch");
      moveIndicator();
    }, 150);
  }
  let activeId = null;

  // ── Surface effects ──
  const fxRoot = document.documentElement.style;
  let ambientSig = "";
  function applyFx(fx, colors) {
    fx = fx || {};
    const level = (on, v) => (on ? Math.max(0, Math.min(100, Number(v) || 0)) / 100 : 0);
    const g = level(fx.gradient, fx.gradient_strength);
    const n = level(fx.noise, fx.noise_strength);
    const a = level(fx.ambient, fx.ambient_strength);
    fxRoot.setProperty("--fx-gradient", g);
    fxRoot.setProperty("--fx-noise", n);
    fxRoot.setProperty("--fx-ambient", a);
    document.body.classList.toggle("fx", g > 0 || n > 0 || a > 0);

    colors = Array.isArray(colors) ? colors : [];
    const sig = JSON.stringify(colors);
    if (sig === ambientSig) return;
    ambientSig = sig;
    const rgb = (c, alpha) => (c ? `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${alpha})` : "transparent");
    const pick = (i) => colors[i] || colors[0];
    const ambEl = $("fx-ambient");
    const amb = ambEl.style;
    amb.setProperty("--amb1", rgb(pick(0), 0.85));
    amb.setProperty("--amb2", rgb(pick(1), 0.7));
    amb.setProperty("--amb3", rgb(pick(2), 0.7));
    amb.setProperty("--amb4", rgb(pick(3), 0.6));
    // The window border reads these too.
    for (const k of ["--amb1", "--amb2", "--amb3"]) fxRoot.setProperty(k, colors.length ? amb.getPropertyValue(k) : "var(--accent-color)");
    const t = performance.now();
    ambEl.classList.toggle("live", t - (applyFx.lastChange || 0) < 4000);
    applyFx.lastChange = t;
    if (colors.length && a > 0 && t - (applyFx.lastShift || 0) > 6000) {
      applyFx.lastShift = t;
      amb.setProperty("--wash", rgb(colors[0], 0.9));
      ambEl.classList.remove("shift");
      void ambEl.offsetWidth;
      ambEl.classList.add("shift");
      clearTimeout(applyFx.shiftTimer);
      applyFx.shiftTimer = setTimeout(() => ambEl.classList.remove("shift"), 4200);
    }
  }

  function renderTabs(tabs) {
    const nextActive = (tabs.find((t) => t.active) || {}).id ?? null;
    const fromEl = activeId !== null ? tabEls.get(activeId) : null;
    const switched = activeId !== null && nextActive !== null && nextActive !== activeId && fromEl && tabEls.has(nextActive);
    activeId = nextActive;
    const seen = new Set();
    let prev = indicator;
    for (const t of tabs) {
      seen.add(t.id);
      let el = tabEls.get(t.id);
      if (!el) { el = makeTab(t); tabEls.set(t.id, el); }
      if (prev.nextSibling !== el) prev.after(el);
      prev = el;
      el.classList.toggle("active", t.active);
      el.classList.toggle("loading", t.loading);
      el.classList.toggle("private", !!t.private);
      el.classList.toggle("asleep", !!(t.asleep || t.sleeping));
      el.classList.toggle("pinned", !!t.pinned);
      el.dataset.group = t.group || 0;
      for (let g = 1; g <= 6; g++) el.classList.toggle("group-" + g, t.group === g);
      const sleepTag = (t.asleep || t.sleeping) ? " (sleeping)" : (t.never_sleep ? " (never sleep)" : "");
      el.title = (t.title ? `${t.title}\n${t.url}` : t.url) + sleepTag + "\nRight-click: colour · Shift+Right-click: pin";
      const title = t.title || pretty(t.url) || "New Tab";
      const titleEl = el.querySelector(".title");
      if (titleEl.textContent !== title) titleEl.textContent = title;
      setFavicon(el, t);
      if (t.active && !vertical) el.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
    }
    for (const [id, el] of tabEls) {
      if (seen.has(id)) continue;
      tabEls.delete(id);
      el.classList.add("leaving");
      el.classList.remove("active");
      setTimeout(() => { el.remove(); moveIndicator(); }, 260);
    }
    if (switched) hopIndicator(fromEl, tabEls.get(nextActive));
    const until = performance.now() + 460;
    const follow = () => { moveIndicator(); if (performance.now() < until) requestAnimationFrame(follow); };
    requestAnimationFrame(follow);
  }
  new ResizeObserver(() => moveIndicator()).observe(tabsEl);
  tabsEl.addEventListener("transitionend", (e) => { if (e.target.classList?.contains("tab")) moveIndicator(); });

  let lastBlocked = 0;

  window.hb = {
    render(s) {
      const L = s.layout || {};
      vertical = flyout || !!L.vertical;
      autohide = !!L.autohide;
      document.body.classList.toggle("vertical", vertical);
      document.body.classList.toggle("autohide", !flyout && autohide);
      document.body.classList.toggle("collapsed", !flyout && !!L.collapsed);
      document.body.classList.toggle("bmbar", !flyout && !!L.bookmarks_bar);
      document.body.classList.toggle("no-anim", L.animations === false);
      applyFx(s.fx, s.ambient);
      fxRoot.setProperty("--content-left", (vertical && !flyout ? (L.sidebar || 0) : 0) + "px");
      fxRoot.setProperty("--win-border", (L.border ?? 3) + "px");
      if (L.sidebar_width && !document.body.classList.contains("resizing")) fxRoot.setProperty("--sidebar-w", L.sidebar_width + "px");
      $("sidebar-toggle").title = L.collapsed ? "Expand the sidebar" : "Collapse the sidebar";
      fxRoot.setProperty("--content-top", (L.top || (vertical ? 48 : 82)) + "px");

      if (!flyout && L.bookmarks_bar) {
        const bms = s.bookmarks || [];
        const bsig = JSON.stringify(bms);
        if (bmbarEl.dataset.sig !== bsig) {
          bmbarEl.dataset.sig = bsig;
          bmbarEl.innerHTML = "";
          for (const b of bms) {
            const btn = document.createElement("button");
            btn.className = "bm-item";
            btn.textContent = b.title || pretty(b.url);
            btn.title = b.url;
            btn.onclick = () => post({ cmd: "navigate", input: b.url });
            bmbarEl.appendChild(btn);
          }
        }
      }

      renderTabs(s.tabs);
      const active = s.tabs.find((t) => t.active);

      currentUrl = s.url || "";
      if (document.activeElement !== addr) addr.value = pretty(currentUrl);
      field.classList.toggle("loading", !!(active && active.loading));
      field.classList.toggle("private", !!(active && active.private));
      $("reload").classList.toggle("loading", !!(active && active.loading));
      $("back").disabled = !s.can_back;
      $("fwd").disabled = !s.can_forward;

      const shield = $("shield");
      if (s.blocked > lastBlocked) {
        shield.classList.remove("bump");
        void shield.offsetWidth;
        shield.classList.add("bump");
      }
      const star = $("star");
      star.hidden = s.bookmarked === null || s.bookmarked === undefined;
      star.classList.toggle("on", !!s.bookmarked);
      star.innerHTML = s.bookmarked ? "&#x2605;" : "&#x2606;";
      star.title = s.bookmarked ? "Remove bookmark (Ctrl+D)" : "Bookmark this page (Ctrl+D)";
      lastBlocked = s.blocked;
      $("blocked").textContent = s.blocked;
      const siteOff = s.site_adblock === false;
      shield.classList.toggle("on", !!s.adblock && !siteOff);
      shield.classList.toggle("off", siteOff);
      shield.title = !s.adblock ? "Ad blocking loading…"
        : siteOff ? "Ad blocking is OFF for this site — click to turn it back on"
        : `Ad & tracker blocking on — ${s.blocked} blocked. Click to turn it off for this site`;

      // Extensions are listed in the menu now.
      $("menu-btn").classList.toggle("open", s.popup === "menu");
    },
    focusAddress() { addr.focus(); addr.select(); },
    // Ctrl+Shift+A: search open tabs.
    tabSearch() {
      addr.focus();
      addr.value = "@"; typed = "@"; suggestSel = -1;
      const r = field.getBoundingClientRect();
      post({ cmd: "suggest", text: "@", x: r.left, w: r.width, y: r.bottom });
    },
    suggestions(list) { if (document.activeElement === addr) { suggestions = list; suggestSel = -1; } },
    peek() {
      clearTimeout(closeTimer);
      document.body.classList.remove("closing");
      requestAnimationFrame(() => document.body.classList.add("open"));
    },
    setUserStyle(css) {
      let el = $("user-theme");
      if (!el) { el = document.createElement("style"); el.id = "user-theme"; document.head.appendChild(el); }
      el.textContent = css || "";
      // Keep a light/dark override (if any) after the user theme.
      const mode = $("mode-theme");
      if (mode) document.head.appendChild(mode);
    },
  };
  post({ cmd: flyout ? "flyout_ready" : "ready" });
</script>
</body>
</html>
