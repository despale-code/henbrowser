[package]
name = "chickenbrowser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
wry = "0.57"
tao = "0.37"
webview2-com = "0.39"
# Must match the version webview2-com is built against (COM types cross the boundary).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_Com", "Win32_UI_Shell"] }
# Decodes page captures for the ambient glow.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows-core = "0.62"
# Default `single-thread` off so the engine is Send and can be compiled on a background thread.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chickenwm-core = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
