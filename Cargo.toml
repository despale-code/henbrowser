[package]
name = "henbrowser"
version = "0.1.1"
edition = "2024"
authors = ["ChickenWM Contributors"]
license = "MIT"
repository = "https://github.com/despale-code/henbrowser"

[dependencies]
wry = "0.57"
tao = "0.37"
webview2-com = "0.39"
# Must match the version webview2-com is built against (COM types cross the boundary).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_Com", "Win32_System_Com_Urlmon", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell"] }
# Decodes page captures for the ambient glow.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows-core = "0.62"
# Default `single-thread` off so the engine is Send and can be compiled on a background thread.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
anyhow = { version = "1.0" }
# Unpacking .crx / .zip extensions; SHA-256 for extension ids from their public keys.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tracing = { version = "0.1" }
chickenwm-core = { git = "https://github.com/despale-code/chickenwm-core", tag = "v0.1.2" }

[build-dependencies]
serde_json = { version = "1.0" }
